<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDKJC MANGA - เว็บอ่านและอัปโหลดมังงะ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }

        header {
            background-color: #1f1f1f;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9800;
            cursor: pointer;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header nav a, header nav span {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        header nav a:hover {
            color: #ff9800;
        }

        .btn-primary {
            background: #ff9800;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* ฟอร์มและกล่องจัดการ */
        .card-box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .card-box h2 {
            margin-bottom: 15px;
            color: #ff9800;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }

        /* Grid รายการมังงะ */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .manga-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #333;
        }

        .manga-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.2);
        }

        .manga-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .manga-card h3 {
            font-size: 1rem;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #ff9800;
            color: #000;
        }

        /* หน้ารายละเอียดมังงะ */
        .manga-header {
            display: flex;
            gap: 20px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .manga-header img {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .chapter-list {
            list-style: none;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #333;
        }

        .chapter-list li {
            padding: 12px 15px;
            border-bottom: 1px solid #2c2c2c;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chapter-list li:hover {
            background: #2c2c2c;
            color: #ff9800;
        }

        /* หน้าอ่านมังงะ */
        .reader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .reader-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .reader-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1f1f1f;
            color: #777;
            margin-top: 50px;
            border-top: 1px solid #333;
        }

        @media (max-width: 600px) {
            .manga-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchSection('home-section')">📚 TDKJC MANGA</div>
        <nav>
            <a onclick="switchSection('home-section')">หน้าแรก</a>
            <div id="auth-nav-area">
                </div>
        </nav>
    </header>

    <main class="container">

        <section id="home-section" class="view-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>มังงะทั้งหมดในระบบ</h2>
                <button class="btn-primary" id="add-manga-btn" style="display:none;" onclick="switchSection('add-manga-section')">+ เพิ่มมังงะเรื่องใหม่</button>
            </div>
            <div class="manga-grid" id="manga-list">
                </div>
        </section>

        <section id="login-section" class="view-section">
            <div class="card-box" style="max-width: 400px; margin: 0 auto;">
                <h2>เข้าสู่ระบบ TDKJC MANGA</h2>
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="login-username" placeholder="กรอกชื่อผู้ใช้...">
                </div>
                <button class="btn-primary" style="width: 100%;" onclick="handleLogin()">เข้าสู่ระบบ / สมัครสมาชิก</button>
            </div>
        </section>

        <section id="add-manga-section" class="view-section">
            <button class="back-btn" onclick="switchSection('home-section')">← กลับหน้าแรก</button>
            <div class="card-box">
                <h2>เพิ่มมังงะเรื่องใหม่</h2>
                <div class="form-group">
                    <label>ชื่อเรื่องมังงะ</label>
                    <input type="text" id="new-manga-title" placeholder="เช่น วันพีช">
                </div>
                <div class="form-group">
                    <label>ภาพปกมังงะ (เลือกไฟล์ภาพจากเครื่อง)</label>
                    <input type="file" id="new-manga-cover" accept="image/*">
                </div>
                <div class="form-group">
                    <label>เรื่องย่อ</label>
                    <textarea id="new-manga-desc" rows="3" placeholder="รายละเอียดเนื้อเรื่อง..."></textarea>
                </div>
                <button class="btn-primary" onclick="saveNewManga()">บันทึกมังงะ</button>
            </div>
        </section>

        <section id="detail-section" class="view-section">
            <button class="back-btn" onclick="switchSection('home-section')">← กลับหน้าแรก</button>
            <div class="manga-header">
                <img id="detail-cover" src="" alt="Cover">
                <div class="manga-info">
                    <h1 id="detail-title">ชื่อเรื่อง</h1>
                    <p id="detail-desc" style="margin-top: 10px; color: #aaa;"></p>
                    <p id="detail-owner" style="margin-top: 10px; font-size: 0.85rem; color: #ff9800;"></p>
                </div>
            </div>

            <div class="card-box" id="add-chapter-box" style="display: none;">
                <h2>เพิ่มตอนใหม่ให้กับเรื่องนี้</h2>
                <div class="form-group">
                    <label>ชื่อตอน (เช่น ตอนที่ 1: จุดเริ่มต้น)</label>
                    <input type="text" id="new-chapter-title" placeholder="ชื่อตอน...">
                </div>
                <div class="form-group">
                    <label>หน้ามังงะ (เลือกไฟล์ภาพหลายไฟล์พร้อมกันจากเครื่องได้)</label>
                    <input type="file" id="new-chapter-pages" accept="image/*" multiple>
                </div>
                <button class="btn-primary" onclick="saveNewChapter()">อัปโหลดตอนใหม่</button>
            </div>

            <h3>รายชื่อตอนทั้งหมด</h3>
            <ul class="chapter-list" id="chapter-list" style="margin-top: 10px;">
                </ul>
        </section>

        <section id="read-section" class="view-section">
            <button class="back-btn" onclick="showDetail(currentMangaId)">← กลับหน้ารายละเอียด</button>
            <h2 id="read-chapter-title" style="text-align: center; margin-bottom: 20px;">ตอนที่ X</h2>
            
            <div class="reader-container" id="reader-images">
                </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 TDKJC MANGA. ข้อมูลถูกบันทึกไว้อย่างปลอดภัยในเบราว์เซอร์ของคุณ</p>
    </footer>

    <script>
        // โหลดข้อมูลเริ่มต้น หรือดึงจาก localStorage ไม่ให้ข้อมูลหาย
        let mangaData = JSON.parse(localStorage.getItem('tdkjc_manga_data')) || [
            {
                id: 1,
                title: "โซโล่ เลเวลอัพ (Demo)",
                cover: "https://via.placeholder.com/150/333/fff?text=Solo+Leveling",
                description: "เรื่องราวของฮันเตอร์สุดกากที่ได้รับโอกาสพลิกชีวิต...",
                owner: "Admin",
                chapters: [
                    { id: 101, title: "ตอนที่ 1: จุดเริ่มต้น", pages: ["https://via.placeholder.com/800x1200/222/fff?text=Page+1", "https://via.placeholder.com/800x1200/333/fff?text=Page+2"] }
                ]
            }
        ];

        let currentUser = localStorage.getItem('tdkjc_current_user') || null;
        let currentMangaId = null;

        // บันทึกข้อมูลลง LocalStorage
        function saveData() {
            localStorage.setItem('tdkjc_manga_data', JSON.stringify(mangaData));
        }

        // จัดการระบบสลับหน้าจอ (Views)
        function switchSection(sectionId) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            window.scrollTo(0, 0);

            if (sectionId === 'home-section') {
                renderMangaList();
                updateAuthNav();
            }
        }

        // ระบบล็อกอินง่ายๆ
        function handleLogin() {
            const usernameInput = document.getElementById('login-username').value.trim();
            if (!usernameInput) {
                alert('กรุณากรอกชื่อผู้ใช้งาน');
                return;
            }
            currentUser = usernameInput;
            localStorage.setItem('tdkjc_current_user', currentUser);
            alert('เข้าสู่ระบบสำเร็จในชื่อ: ' + currentUser);
            switchSection('home-section');
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('tdkjc_current_user');
            alert('ออกจากระบบแล้ว');
            switchSection('home-section');
        }

        // อัปเดตแถบเมนูด้านบนตามสถานะล็อกอิน
        function updateAuthNav() {
            const authNavArea = document.getElementById('auth-nav-area');
            const addMangaBtn = document.getElementById('add-manga-btn');

            if (currentUser) {
                authNavArea.innerHTML = `<span>👤 ${currentUser}</span> <a onclick="handleLogout()" style="color:#ff5252; margin-left:15px;">ออกจากระบบ</a>`;
                addMangaBtn.style.display = 'block';
            } else {
                authNavArea.innerHTML = `<button class="btn-primary" onclick="switchSection('login-section')">เข้าสู่ระบบ</button>`;
                addMangaBtn.style.display = 'none';
            }
        }

        // แสดงรายการมังงะหน้าแรก
        function renderMangaList() {
            const listEl = document.getElementById('manga-list');
            if (mangaData.length === 0) {
                listEl.innerHTML = '<p style="color:#777;">ยังไม่มีมังงะในระบบ มาเพิ่มเรื่องแรกกันเถอะ!</p>';
                return;
            }
            listEl.innerHTML = mangaData.map(manga => `
                <div class="manga-card" onclick="showDetail(${manga.id})">
                    <img src="${manga.cover}" alt="${manga.title}">
                    <h3>${manga.title}</h3>
                </div>
            `).join('');
        }

        // บันทึกมังงะใหม่จากไฟล์
        function saveNewManga() {
            const title = document.getElementById('new-manga-title').value.trim();
            const desc = document.getElementById('new-manga-desc').value.trim();
            const coverFile = document.getElementById('new-manga-cover').files[0];

            if (!title || !coverFile) {
                alert('กรุณากรอกชื่อเรื่องและเลือกไฟล์ภาพปก');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const newManga = {
                    id: Date.now(),
                    title: title,
                    cover: e.target.result, // แปลงไฟล์ภาพเป็น Base64 เก็บไว้ไม่ให้หาย
                    description: desc || 'ไม่มีคำอธิบาย',
                    owner: currentUser,
                    chapters: []
                };

                mangaData.push(newManga);
                saveData(); // บันทึกลง LocalStorage ทันที
                alert('เพิ่มมังงะสำเร็จ!');
                document.getElementById('new-manga-title').value = '';
                document.getElementById('new-manga-desc').value = '';
                document.getElementById('new-manga-cover').value = '';
                switchSection('home-section');
            };
            reader.readAsDataURL(coverFile);
        }

        // แสดงหน้ารายละเอียดมังงะ
        function showDetail(mangaId) {
            currentMangaId = mangaId;
            const manga = mangaData.find(m => m.id === mangaId);
            if (!manga) return;

            document.getElementById('detail-cover').src = manga.cover;
            document.getElementById('detail-title').innerText = manga.title;
            document.getElementById('detail-desc').innerText = manga.description;
            document.getElementById('detail-owner').innerText = `ผู้อัปโหลด: ${manga.owner || 'ไม่ระบุ'}`;

            // แสดงฟอร์มเพิ่มตอนเฉพาะผู้ที่ล็อกอินแล้ว
            const addChapterBox = document.getElementById('add-chapter-box');
            if (currentUser) {
                addChapterBox.style.display = 'block';
            } else {
                addChapterBox.style.display = 'none';
            }

            const chapterListEl = document.getElementById('chapter-list');
            if (manga.chapters.length === 0) {
                chapterListEl.innerHTML = '<li style="color:#777; cursor:default;">ยังไม่มีตอนในเรื่องนี้</li>';
            } else {
                chapterListEl.innerHTML = manga.chapters.map(ch => `
                    <li onclick="readChapter(${manga.id}, ${ch.id})">${ch.title}</li>
                `).join('');
            }

            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('detail-section').classList.add('active');
            window.scrollTo(0, 0);
        }

        // บันทึกตอนใหม่จากไฟล์รูปภาพหลายรูป
        function saveNewChapter() {
            const title = document.getElementById('new-chapter-title').value.trim();
            const pageFiles = document.getElementById('new-chapter-pages').files;

            if (!title || pageFiles.length === 0) {
                alert('กรุณากรอกชื่อตอนและเลือกไฟล์รูปภาพหน้ามังงะอย่างน้อย 1 รูป');
                return;
            }

            const manga = mangaData.find(m => m.id === currentMangaId);
            if (!manga) return;

            let loadedPages = 0;
            let pageDataUrls = new Array(pageFiles.length);

            // อ่านไฟล์ภาพทุกไฟล์ที่เลือกเข้ามา
            Array.from(pageFiles).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pageDataUrls[index] = e.target.result;
                    loadedPages++;

                    // เมื่ออ่านครบทุกไฟล์แล้ว ทำการบันทึก
                    if (loadedPages === pageFiles.length) {
                        const newChapter = {
                            id: Date.now(),
                            title: title,
                            pages: pageDataUrls
                        };

                        manga.chapters.push(newChapter);
                        saveData(); // บันทึกลง LocalStorage
                        alert('เพิ่มตอนใหม่สำเร็จ!');
                        
                        document.getElementById('new-chapter-title').value = '';
                        document.getElementById('new-chapter-pages').value = '';
                        showDetail(currentMangaId);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // อ่านตอนมังงะ
        function readChapter(mangaId, chapterId) {
            const manga = mangaData.find(m => m.id === mangaId);
            const chapter = manga.chapters.find(c => c.id === chapterId);
            if (!chapter) return;

            document.getElementById('read-chapter-title').innerText = `${manga.title} - ${chapter.title}`;
            
            const readerImagesEl = document.getElementById('reader-images');
            readerImagesEl.innerHTML = chapter.pages.map(imgUrl => `
                <img src="${imgUrl}" alt="Manga Page">
            `).join('');

            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('read-section').classList.add('active');
            window.scrollTo(0, 0);
        }

        // เริ่มต้นรันระบบครั้งแรก
        updateAuthNav();
        renderMangaList();
    </script>
</body>
</html>
