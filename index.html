<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaReader - เว็บอ่านมังงะ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }

        header {
            background-color: #1f1f1f;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9800;
            cursor: pointer;
        }

        header nav a {
            color: #bbb;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        header nav a:hover {
            color: #ff9800;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* หน้าแรก: Grid รายการมังงะ */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .manga-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #333;
        }

        .manga-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.2);
        }

        .manga-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .manga-card h3 {
            font-size: 1rem;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ปุ่มย้อนกลับ */
        .back-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #ff9800;
            color: #000;
        }

        /* หน้ารายละเอียดมังงะ */
        .manga-header {
            display: flex;
            gap: 20px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .manga-header img {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .chapter-list {
            list-style: none;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
        }

        .chapter-list li {
            padding: 12px 15px;
            border-bottom: 1px solid #2c2c2c;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chapter-list li:hover {
            background: #2c2c2c;
            color: #ff9800;
        }

        /* หน้าอ่านมังงะ */
        .reader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .reader-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .reader-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .reader-nav button {
            background: #ff9800;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .reader-nav button:hover {
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1f1f1f;
            color: #777;
            margin-top: 50px;
            border-top: 1px solid #333;
        }

        @media (max-width: 600px) {
            .manga-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo" onclick="showHome()">📚 MangaReader</div>
        <nav>
            <a href="#" onclick="showHome(); return false;">หน้าแรก</a>
            <a href="#" onclick="alert('ฟีเจอร์อัปเดตล่าสุด'); return false;">อัปเดตล่าสุด</a>
            <a href="#" onclick="alert('ฟีเจอร์รายการมังงะทั้งหมด'); return false;">รายการมังงะ</a>
        </nav>
    </header>

    <!-- ส่วนเนื้อหาหลัก -->
    <main class="container">

        <!-- หน้าแรก: แสดงรายการมังงะ -->
        <section id="home-section" class="view-section">
            <h2>มังงะยอดนิยม</h2>
            <div class="manga-grid" id="manga-list">
                <!-- ข้อมูลมังงะจะถูกเติมด้วย JavaScript -->
            </div>
        </section>

        <!-- หน้าแสดงรายละเอียดเรื่อง และรายชื่อตอน -->
        <section id="detail-section" class="view-section" style="display: none;">
            <button class="back-btn" onclick="showHome()">← กลับหน้าแรก</button>
            <div class="manga-header">
                <img id="detail-cover" src="" alt="Cover">
                <div class="manga-info">
                    <h1 id="detail-title">ชื่อเรื่อง</h1>
                    <p id="detail-desc" style="margin-top: 10px; color: #aaa;">คำอธิบายเรื่อง...</p>
                </div>
            </div>
            <h3>รายชื่อตอน</h3>
            <ul class="chapter-list" id="chapter-list" style="margin-top: 10px;">
                <!-- รายชื่อตอนจะถูกเติมด้วย JavaScript -->
            </ul>
        </section>

        <!-- หน้าอ่านมังงะ -->
        <section id="read-section" class="view-section" style="display: none;">
            <button class="back-btn" onclick="backToDetail()">← กลับหน้ารายละเอียด</button>
            <h2 id="read-chapter-title" style="text-align: center; margin-bottom: 20px;">ตอนที่ X</h2>
            
            <!-- ส่วนแสดงรูปภาพมังงะ -->
            <div class="reader-container" id="reader-images">
                <!-- รูปภาพหน้ามังงะจะแสดงที่นี่ -->
            </div>

            <div class="reader-nav">
                <button onclick="alert('นี่คือตอนแรกสุด')">← ตอนก่อนหน้า</button>
                <button onclick="backToDetail()">เลือกตอน</button>
                <button onclick="alert('นี่คือตอนสุดท้าย')">ตอนถัดไป →</button>
            </div>
        </section>

    </main>

    <!-- ส่วนท้ายเว็บไซต์ -->
    <footer>
        <p>&copy; 2026 MangaReader. สร้างสรรค์ด้วย HTML, CSS และ JavaScript</p>
    </footer>

    <script>
        // ข้อมูลจำลองของมังงะ
        const mangaData = [
            {
                id: 1,
                title: "โซโล่ เลเวลอัพ (Solo Leveling - Demo)",
                cover: "https://via.placeholder.com/150/333/fff?text=Solo+Leveling",
                description: "เรื่องราวของฮันเตอร์สุดกากที่ได้รับโอกาสพลิกชีวิตในดันเจี้ยนลับและระบบช่วยเหลือปริศนา...",
                chapters: [
                    { id: 101, title: "ตอนที่ 1: จุดเริ่มต้น", pages: [
                        "https://via.placeholder.com/800x1200/222/fff?text=Solo+Leveling+Ch.1+Page+1",
                        "https://via.placeholder.com/800x1200/333/fff?text=Solo+Leveling+Ch.1+Page+2",
                        "https://via.placeholder.com/800x1200/444/fff?text=Solo+Leveling+Ch.1+Page+3"
                    ]},
                    { id: 102, title: "ตอนที่ 2: พลังใหม่", pages: [
                        "https://via.placeholder.com/800x1200/222/fff?text=Solo+Leveling+Ch.2+Page+1",
                        "https://via.placeholder.com/800x1200/333/fff?text=Solo+Leveling+Ch.2+Page+2"
                    ]}
                ]
            },
            {
                id: 2,
                title: "วันพีช (One Piece - Demo)",
                cover: "https://via.placeholder.com/150/444/fff?text=One+Piece",
                description: "การผจญภัยของเด็กหนุ่มหมวกฟาง มังกี้ ดี. ลูฟี่ ผู้มีความฝันอยากจะเป็นราชาโจรสลัด...",
                chapters: [
                    { id: 201, title: "ตอนที่ 1: ROMANCE DAWN", pages: [
                        "https://via.placeholder.com/800x1200/111/fff?text=One+Piece+Ch.1+Page+1",
                        "https://via.placeholder.com/800x1200/222/fff?text=One+Piece+Ch.1+Page+2"
                    ]}
                ]
            }
        ];

        let currentManga = null;
        let currentChapter = null;

        // ฟังก์ชันควบคุมการแสดงผลหน้าต่างๆ
        function showHome() {
            document.getElementById('home-section').style.display = 'block';
            document.getElementById('detail-section').style.display = 'none';
            document.getElementById('read-section').style.display = 'none';
            renderMangaList();
            window.scrollTo(0, 0);
        }

        function renderMangaList() {
            const listEl = document.getElementById('manga-list');
            listEl.innerHTML = mangaData.map(manga => `
                <div class="manga-card" onclick="showDetail(${manga.id})">
                    <img src="${manga.cover}" alt="${manga.title}">
                    <h3>${manga.title}</h3>
                </div>
            `).join('');
        }

        function showDetail(mangaId) {
            currentManga = mangaData.find(m => m.id === mangaId);
            if (!currentManga) return;

            document.getElementById('detail-cover').src = currentManga.cover;
            document.getElementById('detail-title').innerText = currentManga.title;
            document.getElementById('detail-desc').innerText = currentManga.description;

            const chapterListEl = document.getElementById('chapter-list');
            chapterListEl.innerHTML = currentManga.chapters.map(ch => `
                <li onclick="readChapter(${ch.id})">${ch.title}</li>
            `).join('');

            document.getElementById('home-section').style.display = 'none';
            document.getElementById('detail-section').style.display = 'block';
            document.getElementById('read-section').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function readChapter(chapterId) {
            currentChapter = currentManga.chapters.find(c => c.id === chapterId);
            if (!currentChapter) return;

            document.getElementById('read-chapter-title').innerText = currentChapter.title;
            
            const readerImagesEl = document.getElementById('reader-images');
            readerImagesEl.innerHTML = currentChapter.pages.map(imgUrl => `
                <img src="${imgUrl}" alt="Manga Page">
            `).join('');

            document.getElementById('detail-section').style.display = 'none';
            document.getElementById('read-section').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function backToDetail() {
            if (currentManga) {
                showDetail(currentManga.id);
            } else {
                showHome();
            }
        }

        // เริ่มต้นรันระบบโดยแสดงหน้าแรก
        renderMangaList();
    </script>
</body>
</html>
